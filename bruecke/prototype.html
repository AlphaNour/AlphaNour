<title>Brücke Deutsch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating glass rail on the left (collapses to icons), one centred study surface; phone = bottom tab bar. Single dark look by choice. */
:root{
  color-scheme: dark;
  --ink:#09080b; --slab:#141317; --slab-2:#1b1a1f;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.12);
  --paper:#ece6dc; --mute:#8d8894; --dim:#5c5862;
  --violet:#b25cff; --violet-soft:rgba(178,92,255,.32);
  --der:#8fb1ff; --die:#ff8faa; --das:#88dcb4;
  --ok:#88dcb4; --bad:#ff8faa; --warn:#f2c57c;
  --f-ui:"Geist","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-card:26px; --r-tile:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(55% 45% at 78% -8%,rgba(255,255,255,.075),transparent 62%),radial-gradient(40% 40% at 0% 30%,rgba(178,92,255,.05),transparent 70%);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:12px}
svg.lucide{stroke-width:1.5;width:20px;height:20px;flex:none}

.app{min-height:100%;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px}

/* rail */
.rail{position:sticky;top:20px;align-self:start;width:76px;transition:width .35s cubic-bezier(.2,.7,.2,1);
  background:linear-gradient(180deg,#17161a,#0f0e11);border:1px solid var(--line);border-radius:30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 60px -20px rgba(0,0,0,.7);padding:18px 12px;display:flex;flex-direction:column;gap:6px}
.rail.open{width:236px}
.brand{display:flex;align-items:center;gap:10px;height:40px;padding-left:14px;white-space:nowrap;overflow:hidden}
.brand svg{width:24px;height:24px;flex:none}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em;opacity:0;transition:opacity .2s}
.rail.open .brand b{opacity:1}
.sep{height:1px;margin:8px 6px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)}
.nav{position:relative;display:flex;align-items:center;gap:14px;height:44px;padding:0 13px;border-radius:999px;color:var(--mute);white-space:nowrap;overflow:hidden;border:1px solid transparent;transition:color .2s,background .2s,border-color .2s}
.nav:hover{color:var(--paper);background:rgba(255,255,255,.03)}
.nav .lbl{font-size:14px;font-weight:500;opacity:0;transition:opacity .2s}
.rail.open .nav .lbl{opacity:1}
.nav .badge{margin-left:auto;font:500 11px/1 var(--f-mono);padding:4px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--paper);opacity:0;transition:opacity .2s}
.rail.open .nav .badge{opacity:1}
.nav .pip{position:absolute;top:8px;left:31px;width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 8px var(--violet);transition:opacity .2s}
.rail.open .nav .pip{opacity:0}
.nav.on{color:var(--paper);border-color:var(--line-2);overflow:visible;background:radial-gradient(130% 160% at 0% 50%,var(--violet-soft),transparent 58%),rgba(255,255,255,.025);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.nav.on::before{content:"";position:absolute;left:-12px;top:50%;width:3px;height:18px;margin-top:-9px;border-radius:3px;background:var(--violet);box-shadow:0 0 12px 2px var(--violet-soft)}
.spacer{flex:1;min-height:12px}

/* top */
.main{min-width:0;display:flex;flex-direction:column;gap:28px;padding-top:6px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px}
.top h1{margin:0;font-size:28px;font-weight:500;letter-spacing:-.025em;text-wrap:balance}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:var(--slab);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.seg button{height:30px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--mute);display:inline-flex;align-items:center;gap:6px;transition:color .2s,background .2s}
.seg button:hover{color:var(--paper)}
.seg button.on{color:var(--paper);background:var(--slab-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px var(--line-2)}
.seg svg.lucide{width:14px;height:14px}
.pill{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;background:var(--slab);border:1px solid var(--line);font:500 13px/1 var(--f-ui);color:var(--mute);transition:color .2s,border-color .2s}
.pill svg.lucide{width:15px;height:15px}
.pill b{font-family:var(--f-mono);font-weight:500;color:var(--paper);font-variant-numeric:tabular-nums}
.pill.flame svg.lucide{color:var(--warn)}
button.pill:hover{color:var(--paper);border-color:var(--line-2)}
button.pill.active{color:var(--paper);border-color:rgba(178,92,255,.5)}
button.pill.active svg.lucide{color:var(--violet)}
.scope{position:relative;display:inline-flex}
.scope select{appearance:none;-webkit-appearance:none;height:38px;padding:0 36px 0 14px;border-radius:999px;background:var(--slab);border:1px solid var(--line);color:var(--paper);font:500 13px/1 var(--f-ui);cursor:pointer;max-width:240px}
.scope svg.lucide{position:absolute;right:12px;top:50%;margin-top:-7px;width:14px;height:14px;color:var(--mute);pointer-events:none}
.scope select option,.scope select optgroup{background:#141317;color:var(--paper)}

.view{display:flex;flex-direction:column;align-items:center;gap:22px}
.stage{width:100%;max-width:660px;padding-top:44px;display:flex;flex-direction:column;gap:18px}
.wide{width:100%;max-width:1080px;display:flex;flex-direction:column;gap:22px}

/* card */
.card{position:relative;border-radius:var(--r-card);padding:72px 36px 32px;background:linear-gradient(160deg,#1c1b20 0%,#141317 45%,#111013 100%);border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 40px 80px -30px rgba(0,0,0,.85),0 2px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;gap:22px;transition:box-shadow .3s}
.tile{position:absolute;top:-44px;left:28px;width:92px;height:92px;border-radius:var(--r-tile);display:grid;place-items:center;background:linear-gradient(145deg,#25242a,#141317);border:1px solid var(--line);
  box-shadow:0 22px 40px -10px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.09),inset 0 -3px 8px rgba(0,0,0,.45)}
.tile svg.lucide{width:40px;height:40px;stroke-width:1.4;color:var(--paper);filter:drop-shadow(0 4px 10px rgba(236,230,220,.18))}
.card-top{position:absolute;top:22px;right:24px;left:140px;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-size:13px;color:var(--paper)}
.chip i{font-style:normal;color:var(--mute)}
.boxes{display:flex;gap:4px}
.boxes span{width:6px;height:6px;border-radius:2px;background:var(--line-2)}
.boxes span.f{background:var(--violet);box-shadow:0 0 6px var(--violet-soft)}
.head{display:flex;flex-direction:column;gap:14px;outline:none}
.word{text-align:left;font-size:clamp(40px,7.4vw,62px);line-height:1.02;font-weight:500;letter-spacing:-.035em;display:inline-flex;align-items:baseline;gap:.28em;flex-wrap:wrap;width:fit-content}
.word .art{font-weight:400}
.word:hover .n{text-shadow:0 0 24px rgba(236,230,220,.18)}
.a-der{color:var(--der)} .a-die{color:var(--die)} .a-das{color:var(--das)}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:center;font-size:15px}
.meta .k{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.meta .v{display:flex;align-items:center;gap:8px;color:var(--paper);min-width:0;flex-wrap:wrap}
.meta .v.muted{color:var(--mute)}
.meta .v small{color:var(--mute);font-size:13px}
.why-ex{color:var(--warn)}
.pl-val{display:inline-flex;gap:8px;align-items:center;filter:blur(7px);opacity:.45;transition:filter .35s,opacity .35s;user-select:none}
.head:hover .pl-val,.head:focus-within .pl-val,.head.show .pl-val{filter:none;opacity:1;user-select:auto}
.pl-hint{font-size:12px;color:var(--dim);transition:opacity .25s}
.head:hover .pl-hint,.head:focus-within .pl-hint,.head.show .pl-hint{opacity:0}
.icon-btn{width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;color:var(--mute);border:1px solid transparent;transition:all .2s;flex:none}
.icon-btn:hover{color:var(--paper);border-color:var(--line-2);background:rgba(255,255,255,.03)}
.icon-btn svg.lucide{width:16px;height:16px}
.icon-btn.talking{color:var(--violet)}
.hatch{position:relative;height:14px;border-radius:7px;border:1px solid var(--line);overflow:hidden;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.045) 0 2px,transparent 2px 7px)}
.hatch span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,rgba(178,92,255,.25),rgba(178,92,255,.6));box-shadow:0 0 14px var(--violet-soft);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.hatch.thin{height:8px;border-radius:4px}
.hatch-row{display:flex;align-items:center;gap:12px}
.hatch-row .hatch{flex:1}
.hatch-row small{font:500 11px/1 var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.sent{display:flex;flex-direction:column;gap:12px}
.de{margin:0;font-size:19px;line-height:1.7;color:var(--paper);max-width:60ch;text-wrap:pretty}
.line{display:flex;gap:10px;align-items:flex-start}
.line .icon-btn{margin-top:4px}
.hl{border-radius:4px}
.hl.sg{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px}
.hl.sg.a-der{color:var(--der)} .hl.sg.a-die{color:var(--die)} .hl.sg.a-das{color:var(--das)}
.hl.pl{color:var(--paper);text-decoration:underline dotted var(--violet);text-decoration-thickness:2px;text-underline-offset:5px}
.hl.new::after{content:"new";font:500 9px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--violet);vertical-align:super;margin-left:3px}
.lens{cursor:help;padding:1px 4px;margin:0 -1px;border-radius:6px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .2s}
.lens:hover,.lens:focus-visible,.lens.on{background:var(--violet-soft);outline:none}
.en{margin:0;font-size:16px;line-height:1.6;color:var(--mute);max-width:62ch;transition:filter .4s,opacity .4s}
.en.hidden{filter:blur(8px);opacity:.5;user-select:none}
.label{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.ff{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(242,197,124,.06);border:1px solid rgba(242,197,124,.18);color:var(--paper);font-size:14px}
.ff svg.lucide{color:var(--warn);width:18px;height:18px;margin-top:1px}
.lens-note{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.lens-note svg.lucide{width:14px;height:14px}
.prompt-en{margin:0;font-size:clamp(22px,3.4vw,28px);line-height:1.35;font-weight:450;letter-spacing:-.015em;text-wrap:balance}
.compose{width:100%;min-height:96px;resize:vertical;border-radius:16px;padding:14px 16px;background:rgba(0,0,0,.25);border:1px solid var(--line-2);color:var(--paper);font:400 17px/1.55 var(--f-ui);box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.compose::placeholder{color:var(--dim)}
.compose:focus{outline:none;border-color:rgba(178,92,255,.55);box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 0 0 4px rgba(178,92,255,.12)}
.diff .hit{color:var(--paper)}
.diff .miss{color:var(--bad);text-decoration:underline wavy rgba(255,143,170,.5);text-underline-offset:5px}
.score{display:flex;align-items:center;gap:10px;font:500 12px/1 var(--f-mono);color:var(--mute)}
.score b{color:var(--paper);font-size:20px;font-family:var(--f-ui);font-weight:500}
.hint-row{display:flex;flex-wrap:wrap;gap:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{min-height:50px;padding:0 20px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:500;background:var(--slab);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:background .2s,border-color .2s,transform .1s,opacity .2s}
.btn:hover:not(:disabled){background:var(--slab-2);border-color:var(--line-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.grow{flex:1}
.btn.primary{border-color:rgba(178,92,255,.45);background:radial-gradient(120% 180% at 0% 50%,rgba(178,92,255,.28),transparent 60%),var(--slab-2)}
.btn.primary:hover{border-color:rgba(178,92,255,.7)}
.btn kbd{font:500 11px/1 var(--f-mono);padding:4px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--mute)}
.btn.again svg.lucide{color:var(--bad)} .btn.got svg.lucide{color:var(--ok)}
.btn.right{border-color:rgba(136,220,180,.6);box-shadow:0 0 24px -6px rgba(136,220,180,.45)}
.btn.wrong{border-color:rgba(255,143,170,.55);opacity:.8}
.btn.faded{opacity:.35}
.keys{font:400 12px/1.6 var(--f-mono);color:var(--dim);text-align:center}
.keys kbd{font:inherit;color:var(--mute);padding:1px 5px;border:1px solid var(--line);border-radius:5px}

/* practice */
.pr-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 12px/1 var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.pr-meta b{font:500 20px/1 var(--f-ui);color:var(--paper)}
.big-noun{font-size:clamp(44px,8vw,68px);font-weight:500;letter-spacing:-.035em;line-height:1.05}
.clue{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:14.5px;color:var(--paper)}
.clue svg.lucide{width:18px;height:18px;color:var(--violet);margin-top:1px}
.clue.ex svg.lucide{color:var(--warn)}
.result{display:flex;flex-direction:column;gap:10px}
.opts-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts-3 .btn{min-height:64px;font-size:20px;border-radius:18px}
.opts-8{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.opts-8 .btn{min-height:72px;flex-direction:column;gap:4px;border-radius:18px;padding:8px}
.opts-8 .btn b{font:500 20px/1 var(--f-mono)}
.opts-8 .btn small{font-size:11.5px;color:var(--mute);font-weight:400}
.card.flash-ok{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(136,220,180,.5),0 0 40px -6px rgba(136,220,180,.35)}
.card.flash-bad{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mix{display:flex;flex-wrap:wrap;gap:6px}
.mix span{font:500 11px/1 var(--f-mono);padding:6px 8px;border-radius:8px;border:1px solid var(--line);color:var(--mute)}
.mix span b{color:var(--paper);font-weight:500;margin-left:4px}

/* lessons */
.book{display:flex;flex-direction:column;gap:10px}
.book h2{margin:0 0 4px;font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;gap:10px;align-items:center}
.book h2::after{content:"";flex:1;height:1px;background:var(--line)}
.lesson{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border-radius:18px;text-align:left;background:linear-gradient(160deg,#18171c,#111013);border:1px solid var(--line);transition:border-color .2s}
.lesson:hover{border-color:var(--line-2)}
.lesson.on{border-color:rgba(178,92,255,.5);background:radial-gradient(90% 160% at 0% 50%,rgba(178,92,255,.14),transparent 60%),linear-gradient(160deg,#18171c,#111013)}
.lesson .num{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font:500 15px/1 var(--f-mono);background:linear-gradient(145deg,#25242a,#151418);border:1px solid var(--line)}
.lesson .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.lesson .ttl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.lesson .ttl b{font-size:16px;font-weight:500}
.lesson .ttl small{font-size:12.5px;color:var(--mute)}
.lesson .strip{display:flex;gap:6px;color:var(--mute);flex-wrap:wrap}
.lesson .strip svg.lucide{width:16px;height:16px}
.lesson .go{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.lesson .go svg.lucide{width:16px;height:16px}
.tag-next{font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--violet);border:1px solid rgba(178,92,255,.4);padding:4px 6px;border-radius:6px}

/* stories */
.story{display:flex;flex-direction:column;gap:6px}
.st-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.st-row:first-child{border-top:0}
.st-row .de{font-size:18px}
.st-row .en{grid-column:1/-1;font-size:15px;cursor:pointer}
.st-row .tools{display:flex;gap:2px}
.st-list{display:flex;flex-direction:column;gap:8px}
.st-item{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:14px;align-items:center;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.02);text-align:left}
.st-item:hover{border-color:var(--line-2)}
.st-item.on{border-color:rgba(178,92,255,.5)}
.st-item b{font-weight:500}
.st-item small{display:block;color:var(--mute);font-size:12.5px}
.st-item .cov{font:500 11px/1 var(--f-mono);color:var(--mute);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:8px;border:1px solid var(--line-2);color:var(--mute)}
.status.ready{color:var(--ok);border-color:rgba(136,220,180,.4)}
.status svg.lucide{width:13px;height:13px}

/* word bank */
.bank-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1;min-width:200px;height:42px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:var(--slab);border:1px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--paper);font:inherit;outline:none}
.search svg.lucide{color:var(--mute);width:16px;height:16px}
.dist{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dist div{display:flex;flex-direction:column;gap:7px;min-width:0}
.dist .bar{height:8px;border-radius:4px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px);border:1px solid var(--line);overflow:hidden;position:relative}
.dist .bar span{position:absolute;inset:0 auto 0 0;background:var(--violet);opacity:.75}
.dist small{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:4px}
.dist small b{color:var(--paper);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}

let deVoice=null;
function pickVoice(){if(!("speechSynthesis" in window))return;const v=speechSynthesis.getVoices();deVoice=v.find(x=>/^de[-_]DE/i.test(x.lang)&&/google|natural|premium|enhanced/i.test(x.name))||v.find(x=>/^de[-_]DE/i.test(x.lang))||v.find(x=>/^de/i.test(x.lang))||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text,btn){
  if(!("speechSynthesis" in window)){toast("This browser can't play speech. Try Chrome, Edge or Safari.");return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";if(deVoice)u.voice=deVoice;u.rate=S.slow?.68:.95;
  if(btn){btn.classList.add("talking");u.onend=u.onerror=()=>btn.classList.remove("talking");}
  speechSynthesis.speak(u);
}

/* ================= RULE ENGINE ================= */
function articleWhy(w){
  if(w.m){const [a,label]=w.m.split("|");
    if(/^exception/i.test(label))return {kind:"exception",text:label.replace(/^exception:\s*/i,"Exception: "),clue:"Think about what it means. There's a catch."};
    return {kind:"rule",text:`${label} → ${a}`,clue:`Meaning clue: ${label.toLowerCase()}.`};}
  const lw=w.w.toLowerCase();
  const r=SUFFIXES.find(x=>lw.endsWith(x.s)&&lw.length>x.s.length+1);
  if(r){if(r.a===w.a)return {kind:"rule",text:`Ends in -${r.s} → ${r.a} (${r.conf})`,clue:`Ending clue: it ends in -${r.s}.`};
    return {kind:"exception",text:`Exception: -${r.s} is usually ${r.a}`,clue:`It ends in -${r.s}… but this one breaks the rule.`};}
  return {kind:"none",text:"No rule fits. Learn it with its colour.",clue:"No rule for this one. Trust your colour memory."};
}

function pluralWhy(w){
  const t=ptype(w),g=w.a;
  switch(t){

    case "¨":return "Ends in -el or -er and only adds an umlaut.";
    case "e":return g==="der"?"Masculine: add -e.":"Short neuter nouns often add -e too.";
    case "¨e":return g==="die"?"A few short feminine nouns take ¨-e: Hand, Nacht, Stadt.":"Masculine: add -e with an umlaut.";
    case "er":case "¨er":return "Neuter: add -er, with an umlaut when possible.";
    case "n":return g==="die"?"Feminine: add -n / -en. Works about 9 times in 10.":g==="der"?"Some masculine nouns (n-nouns) add -n: Nachbar, Junge, Student.":"A few neuter nouns add -(e)n: Auge, Bett, Hemd.";

const PT_SHORT={"-":"no change","¨":"umlaut only","e":"-e","¨e":"¨-e","er":"-er","¨er":"¨-er","n":"-(e)n","s":"-s"};

/* ================= CASE LENS ================= */
const CASES={N:["Nominativ",0],A:["Akkusativ",1],D:["Dativ",2]};
const GEN={der:"m",die:"f",das:"n"};
const GNAME={m:"masculine",f:"feminine",n:"neuter",pl:"plural"};
const DET=/^(der|die|das|den|dem|des|ein|eine|einen|einem|einer|eines|kein\w*|mein\w*|dein\w*|sein\w*|ihr\w*|unser\w*|euer\w*|dies\w*)$/i;
function forms(det,g){
  const d=det.toLowerCase();
  if(/^(der|die|das|den|dem|des)$/.test(d))return {m:["der","den","dem"],f:["die","die","der"],n:["das","das","dem"],pl:["die","die","den"]}[g];
  if(/^dies/.test(d))return {m:["dieser","diesen","diesem"],f:["diese","diese","dieser"],n:["dieses","dieses","diesem"],pl:["diese","diese","diesen"]}[g];
  const st=(d.match(/^(unser|euer|kein|mein|dein|sein|ihr|ein)/)||[])[1];if(!st)return null;
  return {m:[st,st+"en",st+"em"],f:[st+"e",st+"e",st+"er"],n:[st,st,st+"em"],pl:[st+"e",st+"e",st+"en"]}[g];
}
const LENS=[];
function findNoun(tok){
  const t=tok.replace(/[^A-Za-zÄÖÜäöüß]/g,"");
  let w=WORDS.find(x=>x.w===t);if(w)return {w,pl:false};
  w=WORDS.find(x=>x.p===t||x.p===t.replace(/n$/,""));if(w)return {w,pl:true};
  w=WORDS.find(x=>x.w===t.replace(/n$/,""));if(w)return {w,pl:false};
  return null;
}
function phraseHTML(phrase,cs,why,ctx,isPl,markNew){
  const toks=phrase.split(" ");const hit=ctx?{w:ctx,pl:isPl}:findNoun(toks[toks.length-1]);
  const w=hit&&hit.w;const pl=hit?hit.pl:isPl;
  const cls=pl?"hl pl":`hl sg a-${w?w.a:"der"}`;
  const isNew=markNew&&w&&!known(w)?" new":"";
  let inner=esc(phrase);
  if(cs&&CASES[cs]&&w&&DET.test(toks[0])){
    const g=pl?"pl":GEN[w.a];const f=forms(toks[0],g);
    if(f){const id=LENS.push({det:toks[0],cs,why,g,f,w,pl})-1;
      inner=`<span class="lens" tabindex="0" data-lens="${id}">${esc(toks[0])}</span>${toks.length>1?" "+esc(toks.slice(1).join(" ")):""}`;}
  }
  return `<span class="${cls}${isNew}">${inner}</span>`;
}
function renderSentence(text,ctx,markNew){
  let out="",last=0;const re=/\[([^\]]+)\]|\{([^}]+)\}/g;let m;
  while((m=re.exec(text))){out+=esc(text.slice(last,m.index));
    const isPl=!!m[2];const parts=(m[1]||m[2]).split("|");let [phrase,cs,why]=parts;
    if(ctx&&!isPl&&!cs){[cs,why]=ctx.k.split("|");}
    out+=phraseHTML(phrase,cs,why,ctx,isPl,markNew);last=re.lastIndex;}

}
const tip=$("#lensTip");let tipFor=null;
function showLens(el){
  const L=LENS[+el.dataset.lens];if(!L)return;const [name,ix]=CASES[L.cs];const cur=L.det.toLowerCase();const base=L.f[0];
  const change=cur===base?`${cur} · no change`:`${base} → ${cur}`;
  tip.innerHTML=`<div class="h"><b>${esc(change)}</b><span>${name}</span></div><p>${esc(L.why||"")}</p>
    <div class="tbl">${["Nom","Akk","Dat"].map((n,k)=>`<div class="${k===ix?"cur":""}"><small>${n}</small>${esc(L.f[k])}</div>`).join("")}</div>
    <div class="g">${L.pl?"Plural":"<span class='a-"+L.w.a+"'>"+L.w.a+"</span> "+esc(L.w.w)+" is "+GNAME[L.g]}${L.pl?" · die "+esc(L.w.p):""}</div>`;
  tip.hidden=false;document.querySelectorAll(".lens.on").forEach(x=>x.classList.remove("on"));el.classList.add("on");tipFor=el;
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  let left=Math.min(Math.max(12,r.left+r.width/2-tw/2),innerWidth-tw-12);let top=r.top-th-10;if(top<12)top=r.bottom+10;

function hideLens(){tip.hidden=true;if(tipFor)tipFor.classList.remove("on");tipFor=null;}
document.addEventListener("mouseover",e=>{const l=e.target.closest&&e.target.closest(".lens");if(l)showLens(l);});

addEventListener("scroll",hideLens,{passive:true});

/* ================= CARDS ================= */
function buildQueue(front){
  const list=pool().slice().sort((a,b)=>box(a)-box(b)||Math.random()-.5);
  S.queue=list.map(w=>w.id);
  if(front&&front.length){S.queue=front.concat(S.queue.filter(id=>!front.includes(id)));}
  S.idx=0;resetCard();
}
function resetCard(){S.revealed=false;S.checked=false;S.hint=false;S.draft="";}
const cur=()=>WORDS[S.queue[S.idx]];
function grade(ok){
  const w=cur();if(!w)return;S.prog[w.id]=ok?Math.min(box(w)+1,4):0;bump();
  if(!ok)S.queue.splice(Math.min(S.idx+4,S.queue.length),0,w.id);
  S.idx++;if(S.idx>=S.queue.length){buildQueue();toast("Round complete. Shuffled a fresh deck.");}
  resetCard();save();renderStats();renderCard();
}
function diff(target,input){
  const norm=t=>t.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[^a-z0-9]/g,"");
  const T=target.split(/\s+/).filter(Boolean),tn=T.map(norm),U=input.split(/\s+/).map(norm).filter(Boolean);
  const m=tn.length,n=U.length,L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=tn[i]&&tn[i]===U[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const hit=new Array(m).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(tn[i]&&tn[i]===U[j]){hit[i]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  return {html:T.map((t,k)=>`<span class="${hit[k]?"hit":"miss"}">${esc(t)}</span>`).join(" "),hits:hit.filter(Boolean).length,total:m};
}
function boxesHTML(w){const b=box(w);return `<span class="boxes" title="Memory box ${b+1} of 5">${[0,1,2,3,4].map(k=>`<span class="${b>0&&k<=b?"f":""}"></span>`).join("")}</span>`;}
function topHTML(w){const l=lessonOf(w.L);return `<div class="tile"><i data-lucide="${w.i}"></i></div><div class="card-top">${boxesHTML(w)}<span class="chip">${esc(w.c)} <i>· ${l.book} L${l.n}</i></span></div>`;}

function storyNouns(st){const set=new Set();st.s.forEach(([de])=>{(de.match(/\[([^\]]+)\]|\{([^}]+)\}/g)||[]).forEach(m=>{const ph=m.slice(1,-1).split("|")[0].split(" ");const h=findNoun(ph[ph.length-1]);if(h)set.add(h.w.id);});});return [...set].map(id=>WORDS[id]);}

    <div class="story">${st.s.map(([de,en],k)=>`<div class="st-row"><p class="de">${renderSentence(de,null,true)}</p>
      <div class="tools"><button class="icon-btn" data-ss="${k}" title="Listen"><i data-lucide="volume-2"></i></button></div>
      <p class="en ${S.storyEn?"":"hidden"}" data-en-row title="Tap to show the English">${esc(en)}</p></div>`).join("")}</div>
    <div class="lens-note"><i data-lucide="circle-help"></i>Hover any highlighted article for its case. Tap a blurred line to see the English.</div>
    </article>
    <div class="st-list">${STORIES.map((x,i)=>{const cc=coverage(x);return `<button class="st-item ${i===S.story?"on":""}" data-st="${i}"><span><b>${esc(x.t)}</b><small>${esc(lessonLabel(x.L))}${i===ti?" · today":""}</small></span>
      <span class="hatch thin"><span style="width:${cc.k/cc.total*100}%"></span></span><span class="cov">${cc.k}/${cc.total}</span></button>`;}).join("")}</div>`;
  icons();
  document.querySelectorAll("[data-ss]").forEach(b=>b.onclick=()=>say(plain(st.s[+b.dataset.ss][0]),b));
  document.querySelectorAll("[data-en-row]").forEach(p=>p.onclick=()=>p.classList.toggle("hidden"));
  document.querySelectorAll("[data-en]").forEach(b=>b.onclick=()=>{S.storyEn=b.dataset.en==="1";renderStories();});
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{S.story=+b.dataset.st;renderStories();scrollTo({top:0,behavior:"smooth"});});
  $("#stPlay").onclick=e=>say(st.s.map(x=>plain(x[0])).join(" "),e.currentTarget);
  const sb=$("#stStudy");if(sb)sb.onclick=()=>{S.scope="all";S.mode="de";save();applyPrefs();buildQueue(missing.map(w=>w.id));resetAux();setView("cards");toast(`${missing.length} story words are up next.`);};
}

/* ================= LESSONS ================= */
function renderLessons(){
  const next=LESSONS.find(l=>WORDS.filter(w=>w.L===l.id).some(w=>!known(w)));
  const row=(l)=>{const ws=WORDS.filter(w=>w.L===l.id),k=ws.filter(known).length;
    return `<button class="lesson ${S.scope===l.id?"on":""}" data-l="${l.id}"><span class="num">${l.n}</span>
      <span class="body"><span class="ttl"><b>${esc(l.t)}</b><small>${ws.length} words · ${k} known</small>${next&&next.id===l.id?`<span class="tag-next">Next up</span>`:""}</span>
      <span class="hatch thin"><span style="width:${k/ws.length*100}%"></span></span>
      <span class="strip">${ws.map(w=>`<i data-lucide="${w.i}"></i>`).join("")}</span></span>
      <span class="go">Study<i data-lucide="arrow-right"></i></span></button>`;};
  const books=[...new Set(LESSONS.map(l=>l.book))];
  $("#lessonsEl").innerHTML=`<div class="intro"><p><b>Same order as your books.</b> Each lesson is one chunk of words, in the order they appear in the book. Study a chunk before class, then read it in context in the daily story.</p></div>
    <button class="lesson ${S.scope==="all"?"on":""}" data-l="all"><span class="num"><i data-lucide="layers"></i></span><span class="body"><span class="ttl"><b>All lessons</b><small>${WORDS.length} words · ${WORDS.filter(known).length} known</small></span></span><span class="go">Study<i data-lucide="arrow-right"></i></span></button>
    ${books.map(b=>`<section class="book"><h2>Book ${esc(b)}</h2>${LESSONS.filter(l=>l.book===b).map(row).join("")}</section>`).join("")}`;
  icons();
  document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.scope=b.dataset.l;save();applyPrefs();buildQueue();resetAux();setView("cards");});
}
function resetAux(){AP.w=null;AP.ans=null;PT.w=null;PT.ans=null;delete $("#bank").dataset.built;}

/* ================= WORD BANK ================= */
function renderBank(){
  const el=$("#bank");const p=pool();const counts=[0,0,0,0,0];p.forEach(w=>counts[box(w)]++);
  const names=["New","Box 2","Box 3","Box 4","Known"];
  const nz=t=>t.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");const q=nz(S.q);
  const list=p.filter(w=>(S.art==="all"||w.a===S.art)&&(!q||[w.w,w.p,w.t,w.c].some(x=>nz(x).includes(q))));
  if(!el.dataset.built){
    el.innerHTML=`<div class="dist" id="dist"></div><div class="bank-tools">
        <label class="search"><i data-lucide="search"></i><input id="q" type="search" placeholder="Search German or English" autocomplete="off"></label>
        <div class="seg">${["all","der","die","das"].map(a=>`<button data-art="${a}" class="${S.art===a?"on":""}">${a==="all"?"All":`<span class="a-${a}">${a}</span>`}</button>`).join("")}</div>
      </div><div class="grid" id="grid"></div>`;
    el.dataset.built="1";icons();$("#q").value=S.q;
    $("#q").oninput=e=>{S.q=e.target.value;renderBank();};
    el.querySelectorAll("[data-art]").forEach(b=>b.onclick=()=>{S.art=b.dataset.art;el.querySelectorAll("[data-art]").forEach(x=>x.classList.toggle("on",x===b));renderBank();});
  }
  $("#dist").innerHTML=names.map((n,k)=>`<div><small>${n}<b>${counts[k]}</b></small><div class="bar"><span style="width:${p.length?counts[k]/p.length*100:0}%"></span></div></div>`).join("");
  $("#grid").innerHTML=list.length?list.map(w=>{const l=lessonOf(w.L);return `<button class="wt" data-id="${w.id}" title="Open card"><span class="ti"><i data-lucide="${w.i}"></i></span><span class="lv">${l.book}·L${l.n}</span>
      <span class="w"><span class="a-${w.a}">${w.a}</span> ${esc(w.w)}</span>
      <span class="sub"><span class="g">${esc(w.c)}${w.b?" · ≈ "+esc(w.b.split(" · ")[0]):""}</span><span class="p"><span class="a-die">die</span> ${esc(w.p)}</span></span></button>`;}).join("")
    :`<div class="empty" style="grid-column:1/-1">Nothing matches “${esc(S.q)}”. Try the English word, or clear the filter.</div>`;
  icons();
  $("#grid").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const id=+b.dataset.id,w=WORDS[id];say(`${w.a} ${w.w}`);const at=S.queue.indexOf(id);if(at>=0)S.queue.splice(at,1);S.queue.splice(S.idx,0,id);resetCard();setView("cards");});
}

/* ================= RULES ================= */
function renderRules(){
  const el=$("#rulesEl");if(el.dataset.built)return;el.dataset.built="1";
  const deck=(a,s)=>WORDS.filter(w=>{const r=articleWhy(w);return w.a===a&&!w.m&&r.kind==="rule"&&w.w.toLowerCase().endsWith(s);}).filter(w=>SUFFIXES.find(x=>w.w.toLowerCase().endsWith(x.s)&&w.w.length>x.s.length+1).s===s).slice(0,4);
  const exc=a=>WORDS.filter(w=>{const lw=w.w.toLowerCase();const r=SUFFIXES.find(x=>lw.endsWith(x.s)&&lw.length>x.s.length+1);return !w.m&&r&&r.a===a&&w.a!==a;});
  const col=a=>{const r=ART_RULES[a];const sufBlock=(list,conf)=>`<div class="sufs">${list.map(s=>`<span class="suf ${conf}">-${s}</span>`).join("")}<span class="conf ${conf}">${conf==="always"?"always":a==="die"?"≈ 90%":"mostly"}</span></div>`;
    const exs=[...r.always,...r.mostly].flatMap(s=>deck(a,s));const ex2=exc(a);
    return `<section class="rule"><h3 class="art a-${a}">${a}</h3>
      <div><h4>By meaning</h4><ul class="mean">${r.meaning.map(([b,s])=>`<li><b>${esc(b)}</b><span>${esc(s)}</span></li>`).join("")}</ul></div>
      <div style="display:flex;flex-direction:column;gap:8px"><h4>By ending</h4>${sufBlock(r.always,"always")}${sufBlock(r.mostly,"mostly")}</div>
      ${exs.length?`<div style="display:flex;flex-direction:column;gap:8px"><h4>From your deck</h4><div class="deckex">${exs.map(w=>`<button data-say="${w.a} ${esc(w.w)}"><span class="a-${w.a}">${w.a}</span> ${esc(w.w)}</button>`).join("")}</div></div>`:""}
      ${ex2.length?`<div style="display:flex;flex-direction:column;gap:8px"><h4 style="color:var(--warn)">Look like ${a}, aren't</h4><div class="deckex">${ex2.map(w=>`<button data-say="${w.a} ${esc(w.w)}"><span class="a-${w.a}">${w.a}</span> ${esc(w.w)}</button>`).join("")}</div></div>`:""}
    </section>`;};
  const PG={n:"die",e:"der",er:"das"};
  const pcount=k=>WORDS.filter(w=>{const t=ptype(w).replace("¨","");return (k==="-"?(t===""||t==="-"):t===k)&&(!PG[k]||w.a===PG[k]);});
  el.innerHTML=`<div class="intro"><p><b>Finding the article.</b> Check three clues, in this order. Most nouns give themselves away with one of them. The rest you learn with their colour.</p>
      <div class="clues"><span class="chip"><b>1</b>Biological sex</span><span class="arr">→</span><span class="chip"><b>2</b>Meaning</span><span class="arr">→</span><span class="chip"><b>3</b>Ending</span></div></div>
    <div class="cols">${["der","die","das"].map(col).join("")}</div>
    <section class="rule"><h3>Plurals <small>Five patterns cover almost every A1 noun</small></h3>
      <div>${PLURAL_RULES.map(r=>{const ws=pcount(r.k).slice(0,5);return `<div class="prow"><div><b>${esc(r.t)}</b><span>${esc(r.d)}</span></div><div style="display:flex;flex-direction:column;gap:8px"><span>${esc(r.ex)}</span>
        ${ws.length?`<div class="deckex">${ws.map(w=>`<button data-say="die ${esc(w.p)}"><span class="a-die">die</span> ${esc(w.p)}</button>`).join("")}</div>`:""}</div></div>`;}).join("")}</div>
      <div class="actions"><button class="btn primary" id="toPl"><i data-lucide="copy"></i>Practise plural endings</button><button class="btn" id="toAp"><i data-lucide="tag"></i>Practise articles</button></div>
    </section>`;
  icons();
  el.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
  $("#toPl").onclick=()=>setView("plurals");$("#toAp").onclick=()=>setView("articles");
}

/* ================= BRIDGES ================= */
function renderBridges(){
  const el=$("#bridgesEl");if(el.dataset.built)return;el.dataset.built="1";
  el.innerHTML=`<div class="intro"><p><b>You already know thousands of German words.</b> English and German split from the same West Germanic parent about 1,500 years ago. German shifted a handful of sounds, English shifted others. Learn the shifts once and words like <b>Wasser</b>, <b>Schiff</b> and <b>Nacht</b> stop being new.</p><p>Tap any pair to hear the German.</p></div>
    <div class="rules">${RULES.map(r=>`<section class="rule"><h3>${esc(r.r)} <small>${esc(r.n)}</small></h3><ul class="bl">${r.x.map(([e,d])=>`<li><button data-say="${esc(d)}"><span class="e">${esc(e)}</span><span class="arr">→</span><span class="d">${esc(d)}</span><i data-lucide="volume-2"></i></button></li>`).join("")}</ul></section>`).join("")}
      <section class="rule warnr"><h3><i data-lucide="triangle-alert"></i> False friends <small>Look English, aren't</small></h3><ul class="bl">${FALSE.map(([d,e])=>`<li><button data-say="${esc(d)}"><span class="d">${esc(d)}</span><span class="arr">=</span><span class="e">${esc(e)}</span><i data-lucide="volume-2"></i></button></li>`).join("")}</ul></section></div>`;
  icons();el.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
}

/* ================= SHELL ================= */
const TITLES={cards:"Cards",lessons:"Lessons",articles:"Article practice",plurals:"Plural trainer",stories:"Daily story",words:"Word bank",rules:"Article & plural rules",bridges:"English bridges"};
const SCOPED=["cards","articles","plurals","words"];
function renderStats(){
  $("#todayN").textContent=S.today.n;$("#dueBadge").textContent=pool().filter(w=>box(w)<2).length;
  $("#eyebrow").textContent=SCOPED.includes(S.view)?`${S.scope==="all"?"All lessons":lessonLabel(S.scope)} · ${pool().length} nouns`:{lessons:"Book order",stories:"Built from words you know",rules:"From your notes",bridges:"The method"}[S.view];
}
function setView(v){
  S.view=v;hideLens();
  document.querySelectorAll(".nav[data-view]").forEach(n=>n.classList.toggle("on",n.dataset.view===v));
  Object.keys(TITLES).forEach(k=>$("#view-"+k).hidden=k!==v);
  $("#title").textContent=TITLES[v];$("#modeSeg").hidden=v!=="cards";$(".scope").hidden=!SCOPED.includes(v);
  ({cards:renderCard,lessons:renderLessons,articles:renderArticles,plurals:renderPlurals,stories:renderStories,words:renderBank,rules:renderRules,bridges:renderBridges})[v]();
  renderStats();
}
function applyPrefs(){
  $("#rail").classList.toggle("open",S.open);
  $("#collapseBtn").title=S.open?"Collapse sidebar":"Expand sidebar";$("#collapseBtn .lbl").textContent=S.open?"Collapse":"Expand";
  $("#slowBtn").classList.toggle("active",S.slow);
  document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===S.mode));
  $("#scope").value=S.scope;
}
$("#scope").innerHTML=`<option value="all">All lessons</option>`+[...new Set(LESSONS.map(l=>l.book))].map(b=>`<optgroup label="Book ${b}">${LESSONS.filter(l=>l.book===b).map(l=>`<option value="${l.id}">${b} · L${l.n} ${l.t}</option>`).join("")}</optgroup>`).join("");
$("#scope").onchange=e=>{S.scope=e.target.value;save();buildQueue();resetAux();setView(S.view);};
document.querySelectorAll(".nav[data-view]").forEach(n=>n.onclick=()=>setView(n.dataset.view));
$("#collapseBtn").onclick=()=>{S.open=!S.open;save();applyPrefs();};
$("#slowBtn").onclick=()=>{S.slow=!S.slow;save();applyPrefs();toast(S.slow?"Slow audio on":"Slow audio off");};
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;resetCard();save();applyPrefs();renderCard();if(S.mode==="en")setTimeout(()=>{const c=$("#compose");if(c)c.focus();},50);});

document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(S.view==="articles"&&!typing){
    const m={"1":"der","2":"die","3":"das"}[e.key];
    if(m&&AP.ans===null){e.preventDefault();apAnswer(m);}else if(e.key==="Enter"&&AP.ans!==null){e.preventDefault();apNext();}else if(k==="h"&&AP.ans===null){AP.hint=true;renderArticles();}
    return;}
  if(S.view==="plurals"&&!typing){
    const n=+e.key;if(n>=1&&n<=8&&PT.ans===null){e.preventDefault();ptAnswer(PL_OPTS[n-1][0]);}else if(e.key==="Enter"&&PT.ans!==null){e.preventDefault();ptNext();}
    return;}
  if(S.view!=="cards")return;const w=cur();if(!w)return;
  const graded=S.mode==="de"?S.revealed:S.checked;
  if(typing&&!(S.checked&&(e.key==="1"||e.key==="2")))return;
  if(e.key===" "&&S.mode==="de"&&!S.revealed){e.preventDefault();reveal();}
  else if(e.key==="1"&&graded){e.preventDefault();grade(false);}
  else if(e.key==="2"&&graded){e.preventDefault();grade(true);}
  else if(k==="l")say(`${w.a} ${w.w}`);
  else if(k==="p"){say(`die ${w.p}`);const h=$("#head");if(h)h.classList.add("show");}
  else if(k==="s")say(plain(w.s));
});

applyPrefs();buildQueue();setView("cards");
</script>
