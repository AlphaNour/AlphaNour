<title>Karl und das Brot</title>

<style>
/* Layout: one phone-width column. A living comic that can play itself, then Morph and Build to turn English into German, then secret-code cards. Karl the cat reacts from the corner. */
:root {
  --bg: #EDF0F5; --surface: #FFFFFF; --sunk: #E2E7EF; --ink: #161B27; --muted: #5A6375; --line: #D2D9E4;
  --accent: #E39B26; --on-accent: #1E1404; --karl: #D9711A; --becker: #2F62A3; --jonas: #6B4BA8;
  --der: #2160E0; --die: #D52C44; --das: #11895A; --good: #11895A; --soft: #D52C44; --glow: rgb(227 155 38 / 0.35);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E121A; --surface: #171D29; --sunk: #202838; --ink: #E8ECF4; --muted: #98A2B5; --line: #2C3547;
  --accent: #F2B544; --karl: #F5A14E; --becker: #7FAAF0; --jonas: #B79BF0;
  --der: #74A3FF; --die: #FF6E80; --das: #3DD68C; --good: #3DD68C; --soft: #FF6E80; --glow: rgb(242 181 68 / 0.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E121A; --surface: #171D29; --sunk: #202838; --ink: #E8ECF4; --muted: #98A2B5; --line: #2C3547;
  --accent: #F2B544; --karl: #F5A14E; --becker: #7FAAF0; --jonas: #B79BF0;
  --der: #74A3FF; --die: #FF6E80; --das: #3DD68C; --good: #3DD68C; --soft: #FF6E80; --glow: rgb(242 181 68 / 0.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 620px; margin: 0 auto; padding-block: 20px 160px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .actor:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header h1 { font: 800 clamp(36px, 10vw, 52px)/1 var(--display); margin: 0; letter-spacing: -0.02em; }
header h1 span { display: inline-block; }
header .sub { margin: 6px 0 0; color: var(--muted); }
header .sub b { color: var(--ink); }

/* Sticky bar: tabs + score + sound */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: grid; gap: 8px; padding-block: 6px; background: var(--bg); }
.hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.score { display: inline-flex; align-items: center; gap: 6px; font: 800 18px var(--display); font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 10px; }
.score.bump { animation: bump 0.45s ease-out; }
.sound { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 9px 6px; font-size: 15px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgb(0 0 0 / 0.14); }
.intro { margin: 0; color: var(--muted); font-size: 15px; }

/* Player controls */
.player { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.ghost { background: var(--sunk); color: var(--ink); }
.btn.big { padding: 13px 22px; font-size: 18px; box-shadow: 0 6px 0 color-mix(in srgb, var(--accent) 60%, #000); transform: translateY(-3px); transition: transform 0.08s, box-shadow 0.08s; }
.btn.big:active { transform: translateY(0); box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn[disabled] { opacity: 0.45; cursor: default; }
.tip { font-size: 14px; color: var(--muted); margin: 0; }

/* Comic */
.strip { display: grid; gap: 18px; }
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; transition: box-shadow 0.3s, transform 0.3s; }
.panel.live { box-shadow: 0 0 0 5px var(--glow); transform: scale(1.01); }
.panel svg { display: block; width: 100%; height: auto; aspect-ratio: 360 / 200; max-width: 100%; border-bottom: 2px solid var(--ink); }
.caption { margin: 0; padding: 8px 14px; background: #FFE9A8; color: #3A2A05; font-size: 14px; font-style: italic; border-bottom: 2px solid var(--ink); }
.bubbles { display: grid; gap: 10px; padding: 14px; }
.bubble { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start; border-radius: 10px; padding: 4px 6px; margin: -4px -6px; transition: background 0.2s; }
.bubble.speaking { background: var(--sunk); }
.panel.seen .bubble { animation: pop 0.4s cubic-bezier(.2,1.4,.4,1) both; }
.panel.seen .bubble + .bubble { animation-delay: 0.12s; }
.who { grid-column: 1 / -1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.who.karl { color: var(--karl); } .who.becker { color: var(--becker); }
.de-line { font: 700 22px/1.45 var(--body); min-width: 0; }
.en-line { grid-column: 1; color: var(--muted); font-size: 16px; }
.w { border: 0; background: none; padding: 0 2px; border-radius: 5px; font-weight: 700; transition: background 0.15s, transform 0.15s; }
.w:hover { background: var(--sunk); }
.w.lit { background: var(--accent); color: var(--on-accent); transform: translateY(-2px); }
.w.g-m { box-shadow: inset 0 -3px var(--der); } .w.g-f { box-shadow: inset 0 -3px var(--die); } .w.g-n { box-shadow: inset 0 -3px var(--das); }
.w.coded::after { content: "🔑"; font-size: 0.5em; vertical-align: super; }
.play { border: 0; background: var(--sunk); border-radius: 999px; width: 42px; height: 42px; font-size: 18px; grid-row: 2; grid-column: 2; }

/* Living drawings */
.actor { cursor: pointer; }
.tail, .blink, .breathe, .bob, .jumper, .steam path, .float, .shake, .thought { transform-box: fill-box; }
@media (prefers-reduced-motion: no-preference) {
  .tail { transform-origin: 0% 100%; animation: wag 1.8s ease-in-out infinite; }
  .breathe { transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
  .blink { transform-origin: 50% 50%; animation: blink 4.6s infinite; }
  .bob { animation: bob 3.6s ease-in-out infinite; }
  .bob.b2 { animation-duration: 4.2s; animation-delay: -1.3s; }
  .steam path { animation: steam 2.4s ease-in infinite; opacity: 0; }
  .steam path:nth-child(2) { animation-delay: 0.8s; } .steam path:nth-child(3) { animation-delay: 1.6s; }
  .float { animation: float 2.2s ease-in-out infinite; }
  .shake { transform-origin: 50% 50%; animation: shake 0.9s ease-in-out infinite; }
  .thought { animation: bob 2.8s ease-in-out infinite; }
  .jumper.jump { animation: jump 0.55s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 100%; }
  .say-pop { animation: saypop 1.4s ease-out forwards; transform-box: fill-box; transform-origin: 50% 100%; }
  .tok .new { display: inline-block; animation: letter 0.25s ease-out; }
  .tok.shake-x { animation: shakex 0.4s; }
  .code.just { animation: flip 0.7s ease-out; }
  header h1 span { animation: wave 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * 0.08s); }
}
@keyframes wag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.035); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 30% { opacity: 0.8; } 100% { opacity: 0; transform: translateY(-16px); } }
@keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.15); } }
@keyframes shake { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-10deg); } 40% { transform: rotate(9deg); } 60% { transform: rotate(-5deg); } 80% { transform: rotate(3deg); } }
@keyframes jump { 0% { transform: translateY(0) scale(1, 1); } 25% { transform: translateY(0) scale(1.08, 0.9); } 55% { transform: translateY(-22px) scale(0.95, 1.06); } 100% { transform: translateY(0) scale(1, 1); } }
@keyframes saypop { 0% { opacity: 0; transform: scale(0.4); } 15% { opacity: 1; transform: scale(1.1); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }
@keyframes pop { from { transform: scale(0.94); } to { transform: scale(1); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes letter { from { transform: translateY(-8px) scale(1.4); } to { transform: none; } }
@keyframes shakex { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
@keyframes wave { 0%, 100% { transform: translateY(0); } 15% { transform: translateY(-5px); } 30% { transform: translateY(0); } }

/* Morph and Build */
.work { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.work-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.progress { flex: 1 1 120px; height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.4s; }
.thumb { width: 100%; max-width: 100%; border: 2px solid var(--ink); border-radius: 6px; display: block; aspect-ratio: 360 / 200; height: auto; }
.label { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.big-en { margin: 0; font: 700 22px/1.35 var(--body); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tok { border: 2px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 12px; font: 700 19px/1.3 var(--body); min-width: 2.5em; position: relative; }
.tok.todo { border-style: dashed; border-color: var(--accent); }
.tok.todo:hover { transform: translateY(-2px); }
.tok.done { background: var(--surface); }
.tok.done.g-m { border-color: var(--der); } .tok.done.g-f { border-color: var(--die); } .tok.done.g-n { border-color: var(--das); }
.tok .new { color: var(--accent); }
.punct { font: 700 19px var(--body); color: var(--muted); }
.code-pop { margin: 0; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 16%, var(--surface)); font-size: 15px; }
.code-pop b { font-family: var(--display); }
.slot { min-height: 56px; border: 2px dashed var(--line); border-radius: 12px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; transition: border-color 0.2s, background 0.2s; }
.slot.right { border-color: var(--good); border-style: solid; background: color-mix(in srgb, var(--good) 10%, transparent); }
.slot:empty::before { content: "Tap the German words in the right order"; color: var(--muted); font-size: 14px; padding: 0 6px; }
.feedback { margin: 0; min-height: 1.5em; font-size: 16px; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--soft); }
.done-card { text-align: center; display: grid; gap: 10px; justify-items: center; padding: 10px 0; }
.done-card p { margin: 0; }
.done-card .final { font: 800 34px var(--display); }

/* Secret codes */
.codes h2 { font: 800 24px/1.2 var(--display); margin: 0; }
.codes > p { margin: 4px 0 12px; color: var(--muted); font-size: 15px; }
.code-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; perspective: 600px; }
.code { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.code .rule { font: 800 24px/1.1 var(--display); }
.code .ex { font-size: 14px; color: var(--muted); }
.code.locked .rule { color: var(--muted); }
.code.locked .ex { filter: blur(4px); user-select: none; }
.code.open { border-color: var(--accent); }

/* Word sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgb(0 0 0 / 0.16);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.sheet .pair { margin: 0; font: 800 26px/1.2 var(--display); }
.sheet .pair span { color: var(--muted); font-weight: 500; }
.sheet .meta { margin: 0; color: var(--muted); font-size: 15px; grid-column: 1; }
.sheet .acts { grid-row: 1 / span 2; grid-column: 2; display: grid; gap: 6px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up 0.2s ease-out; } @keyframes up { from { transform: translateY(100%); } } }

/* Karl in the corner */
.buddy { position: fixed; z-index: 15; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: flex-end; gap: 6px; pointer-events: none; }
.buddy svg { width: 76px; height: 76px; pointer-events: auto; cursor: pointer; filter: drop-shadow(0 4px 6px rgb(0 0 0 / 0.2)); }
.buddy .talk { background: var(--surface); color: var(--ink); border: 2px solid var(--ink); border-radius: 14px 14px 2px 14px; padding: 6px 12px; font-weight: 700; max-width: 200px; margin-bottom: 46px; opacity: 0; transform: translateY(6px); transition: opacity 0.2s, transform 0.2s; }
.buddy .talk.show { opacity: 1; transform: none; }
.sheet:not([hidden]) ~ .buddy { display: none; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
</style>

<div class="wrap">
  <header>
    <h1 id="title" aria-label="Karl und das Brot">Karl und das Brot</h1>
    <p class="sub"><b>Karl and the bread.</b> A hungry cat walks into a Berlin bakery. Tap the people in the pictures, they talk back.</p>
  </header>

  <div class="bar">
    <div class="hud">
      <span class="score" id="score" title="Brezel points">🥨 <span id="points">0</span></span>
      <button class="sound" id="sound" type="button">🔊 Sound on</button>
    </div>
    <div class="tabs" role="tablist" aria-label="Mode">
      <button role="tab" id="tab-read" data-mode="read" aria-selected="true" type="button">📖 Read</button>
      <button role="tab" id="tab-morph" data-mode="morph" aria-selected="false" type="button">✨ Morph</button>
      <button role="tab" id="tab-build" data-mode="build" aria-selected="false" type="button">🧩 Build</button>
    </div>
  </div>
  <p class="intro" id="intro"></p>

  <main id="main"></main>

  <section class="codes" aria-labelledby="codes-title">
    <h2 id="codes-title">Secret codes</h2>
    <p>English and German are cousins. Many German words are English words with a few letters swapped by the same rules. Morph words to unlock each code.</p>
    <div class="code-grid" id="codes"></div>
  </section>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-label="Word details">
  <div class="sheet-in">
    <p class="pair" id="sh-pair"></p>
    <p class="meta" id="sh-meta"></p>
    <div class="acts">
      <button class="btn" id="sh-say" type="button">🔊 Hear</button>
      <button class="btn ghost" id="sh-close" type="button">Close</button>
    </div>
  </div>
</div>

<div class="buddy" aria-live="polite">
  <div class="talk" id="buddy-talk"></div>
  <svg viewBox="-4 0 108 104" id="buddy" role="button" tabindex="0" aria-label="Karl the cat. Tap him."></svg>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
// ---------- story data ----------
// A token is [english, german, info?] for a word, or [punctuation] alone.
const RULES = {
  'd-t':  { from: 'd', to: 't',   ex: 'good → gut · bread → Brot · day → Tag' },
  'th-d': { from: 'th', to: 'd',  ex: 'that → das · thanks → danke · thou → du' },
  'p-pf': { from: 'p', to: 'pf',  ex: 'apple → Apfel · pepper → Pfeffer' },
  'k-ch': { from: 'k', to: 'ch',  ex: 'milk → Milch · make → machen · book → Buch' },
  't-z':  { from: 't', to: 'z / s', ex: 'cat → Katze · that → das · water → Wasser' },
};
const ART = { m: 'der', f: 'die', n: 'das' };
const LINES = [
  { who: 'karl', en: 'Hello! I am Karl.',
    toks: [['Hello', 'Hallo'], ['!'], ['I', 'Ich'], ['am', 'bin'], ['Karl', 'Karl'], ['.']] },
  { who: 'becker', en: 'Good morning, Karl! Are you hungry?',
    toks: [['Good', 'Guten', { code: ['d-t'] }], ['morning', 'Morgen', { g: 'm' }], [','], ['Karl', 'Karl'], ['!'],
           ['hast', 'Hast', { note: 'Old English “thou hast” means “you have”. German still says it.' }], ['thou', 'du', { code: ['th-d'], note: '“Thou” is old English for “you”.' }], ['hunger', 'Hunger', { g: 'm' }], ['?']] },
  { who: 'karl', en: 'Yes! Milk and bread, please.',
    toks: [['Yeah', 'Ja'], ['!'], ['Milk', 'Milch', { g: 'f', code: ['k-ch'] }], ['and', 'und'], ['bread', 'Brot', { g: 'n', code: ['d-t'] }], [','], ['please', 'bitte'], ['.']] },
  { who: 'becker', en: 'Here is an apple. That is good!',
    toks: [['Here', 'Hier'], ['is', 'ist'], ['an', 'ein'], ['apple', 'Apfel', { g: 'm', code: ['p-pf'] }], ['.'],
           ['That', 'Das', { code: ['th-d', 't-z'] }], ['is', 'ist'], ['good', 'gut', { code: ['d-t'] }], ['!']] },
  { who: 'karl', en: 'An apple?! I am a cat!',
    toks: [['An', 'Ein'], ['apple', 'Apfel', { g: 'm', code: ['p-pf'] }], ['?!'], ['I', 'Ich'], ['am', 'bin'], ['a', 'eine'], ['cat', 'Katze', { g: 'f', code: ['t-z'] }], ['!']] },
  { who: 'becker', en: 'Okay, okay! Here is milk.',
    toks: [['Okay', 'Okay'], [','], ['okay', 'okay'], ['!'], ['Here', 'Hier'], ['is', 'ist'], ['milk', 'Milch', { g: 'f', code: ['k-ch'] }], ['.']] },
  { who: 'karl', en: 'Thanks! That is good.',
    toks: [['Thanks', 'Danke', { code: ['th-d'] }], ['!'], ['That', 'Das', { code: ['th-d', 't-z'] }], ['is', 'ist'], ['good', 'gut', { code: ['d-t'] }], ['.']] },
];
const NAMES = { karl: 'Karl, the cat', becker: 'Frau Becker, the baker' };
// What each character says when tapped in a picture.
const VOICES = {
  karl:   [['Miau!', 'meow'], ['Ich bin Karl!', 'I am Karl!'], ['Hunger!', 'hungry!']],
  becker: [['Guten Tag!', 'good day!'], ['Brot ist gut!', 'bread is good!'], ['Bitte schön!', 'here you go!']],

const INK = '#1E1A16';
(function mountPeople() {
  const holder = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  holder.setAttribute('width', '0'); holder.setAttribute('height', '0');
  holder.setAttribute('aria-hidden', 'true');
  holder.style.position = 'absolute';
  holder.innerHTML = Object.entries(PEOPLE).map(([id, inner]) => `<symbol id="${id}" viewBox="0 0 704 704">${inner}</symbol>`).join('');
  document.body.prepend(holder);
})();
const person = (id, x, y, size, delay = '') =>
  `<g class="actor" data-who="${id.split('-')[0]}" tabindex="0" role="button" aria-label="Tap to hear ${id.startsWith('becker') ? 'Frau Becker' : 'Jonas'}"><g class="jumper"><g class="bob ${delay}"><use href="#${id}" x="${x}" y="${y}" width="${size}" height="${size}"/></g></g></g>`;

function bg() {

  <path d="M0 96 H360" stroke="${INK}" stroke-width="2"/>

function tone(freq, dur, type = 'sine', vol = 0.12, slideTo = null, at = 0) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + at;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch {}
}

// ---------- speech with karaoke ----------
const synth = window.speechSynthesis;
function speak(text, lang = 'de', wordEls = null) {
  return new Promise((resolve) => {
    const clear = () => wordEls && wordEls.forEach((w) => w.classList.remove('lit'));
    let fallback = null, gotBoundary = false;
    const finish = () => { clearInterval(fallback); clear(); resolve(); };
    // Fallback highlighting when the voice gives no word timings (or there is no voice).
    const startFallback = () => {
      if (!wordEls || gotBoundary) return;
      let i = 0;
      const step = () => { clear(); if (wordEls[i]) wordEls[i].classList.add('lit'); i++; };
      step();
      fallback = setInterval(step, 430);
    };
    if (!synth || !soundOn) {
      startFallback();
      setTimeout(finish, wordEls ? wordEls.length * 430 + 200 : 300);
      return;
    }
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'de' ? 'de-DE' : 'en-US';
    const v = synth.getVoices().find((x) => x.lang && x.lang.toLowerCase().startsWith(lang));
    if (v) u.voice = v;
    u.rate = lang === 'de' ? 0.85 : 1;
    if (wordEls) {
      const starts = []; let pos = 0;
      for (const w of wordEls) { const at = text.indexOf(w.textContent, pos); starts.push(at); pos = at + w.textContent.length; }
      u.onboundary = (e) => {
        if (e.name && e.name !== 'word') return;
        gotBoundary = true; clearInterval(fallback); clear();
        let idx = 0; starts.forEach((s, k) => { if (e.charIndex >= s) idx = k; });
        wordEls[idx]?.classList.add('lit');
      };
      setTimeout(startFallback, 450);
    }
    u.onend = finish; u.onerror = finish;
    setTimeout(finish, 9000);
    synth.speak(u);
  });
}

const fx = $('fx'), ctx = fx.getContext('2d');
let parts = [], fxRunning = false;
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', sizeFx); sizeFx();
function burst(x, y, n = 18, spread = 1) {
  if (reduceMotion) return;
  const colors = ['#E39B26', '#2160E0', '#D52C44', '#11895A', '#F28C28', '#FFFFFF'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (2 + Math.random() * 5) * spread;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3 * spread, life: 1, size: 4 + Math.random() * 5, c: pick(colors), r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4 });
  }

}
function burstAt(el, n, spread) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n, spread); }
function confetti() { for (let i = 0; i < 5; i++) setTimeout(() => burst(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * 0.35, 26, 1.4), i * 120); }
function tickFx() {
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter((p) => p.life > 0);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.98; p.r += p.vr; p.life -= 0.016;
    ctx.save(); ctx.globalAlpha = Math.max(p.life, 0); ctx.translate(p.x, p.y); ctx.rotate(p.r);

}

let playing = false;
function renderRead() {
  const box = document.createElement('div');
  box.style.display = 'grid'; box.style.gap = '14px';
  const ctrl = document.createElement('div');
  ctrl.className = 'player';
  const playBtn = Object.assign(document.createElement('button'), { className: 'btn big', type: 'button', textContent: '▶ Play the story' });
  const tip = Object.assign(document.createElement('p'), { className: 'tip', textContent: 'Plays every panel with voices and lights up each word as it is spoken.' });
  ctrl.append(playBtn, tip);
  box.append(ctrl);

  const strip = document.createElement('div');
  strip.className = 'strip';
  const panelEls = [];
  for (const p of PANELS) {
    const art = document.createElement('article');
    art.className = 'panel';
    art.innerHTML = svg(p.art) + (p.caption ? `<p class="caption">${p.caption}</p>` : '');
    const bubbles = document.createElement('div');
    bubbles.className = 'bubbles';
    const items = [];
    for (const i of p.lines) {
      const line = LINES[i];
      const b = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = `<span class="who ${line.who}">${NAMES[line.who]}</span>`;
      const de = document.createElement('div');
      de.className = 'de-line';
      const words = [];
      line.toks.forEach((t, k) => {
        if (!isWord(t)) { de.append(t[0]); return; }
        if (k > 0) de.append(' ');
        const w = document.createElement('button');
        w.type = 'button';
        w.className = 'w' + (t[2]?.g ? ' g-' + t[2].g : '') + (t[2]?.code ? ' coded' : '');
        w.textContent = t[1];
        w.addEventListener('click', () => openSheet(t));
        de.append(w); words.push(w);
      });
      const enEl = Object.assign(document.createElement('div'), { className: 'en-line', textContent: line.en });
      const play = Object.assign(document.createElement('button'), { className: 'play', type: 'button', textContent: '🔊' });
      play.setAttribute('aria-label', 'Hear this line in German');
      play.addEventListener('click', async () => { b.classList.add('speaking'); await speak(germanOf(line), 'de', words); b.classList.remove('speaking'); });
      b.append(de, play, enEl);
      bubbles.append(b);
      items.push({ line, b, words });
    }
    art.append(bubbles);
    strip.append(art);
    wireActors(art);
    panelEls.push({ art, items });
  }
  box.append(strip);

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), { threshold: 0.4 });
    panelEls.forEach(({ art }) => io.observe(art));
  }

  playBtn.addEventListener('click', async () => {
    if (playing) { playing = false; if (synth) synth.cancel(); return; }
    playing = true;
    playBtn.textContent = '■ Stop';
    sfx.pop();
    for (const { art, items } of panelEls) {
      if (!playing) break;
      art.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
      art.classList.add('live');
      await wait(650);
      for (const { line, b, words } of items) {
        if (!playing) break;
        const speaker = art.querySelector(`.actor[data-who="${line.who}"]`);
        if (speaker) jump(speaker);
        b.classList.add('speaking');
        await speak(germanOf(line), 'de', words);
        b.classList.remove('speaking');
        await wait(350);
      }
      art.classList.remove('live');
    }
    if (playing) { sfx.fanfare(); confetti(); buddy('happy', 'Ende! (the end!)'); addPoints(5); }
    playing = false;
    playBtn.textContent = '▶ Play the story';
  });
  return box;
}

// ---------- MORPH ----------
let morphIdx = 0;
function progress(i) { return `<div class="progress" aria-hidden="true"><i style="width:${(i / LINES.length) * 100}%"></i></div>`; }
function renderMorph() {
  const line = LINES[morphIdx];
  const card = document.createElement('section');
  card.className = 'work';
  card.innerHTML = `
    <div class="work-head"><span class="who ${line.who}">${NAMES[line.who]}</span>${progress(morphIdx)}<span class="tip">${morphIdx + 1} / ${LINES.length}</span></div>
    ${svg(panelOfLine(morphIdx).art, 'thumb')}
    <p class="label">1 · What they mean</p>
    <p class="big-en">${line.en}</p>
    <p class="label">2 · Say it the German way, still in English</p>
    <p class="big-en" style="color: var(--muted)">“${bridgeOf(line)}”</p>
    <p class="label">3 · Tap each word to turn it German</p>`;
  wireActors(card);
  const row = Object.assign(document.createElement('div'), { className: 'row' });
  const pop = Object.assign(document.createElement('p'), { className: 'code-pop', hidden: true });
  const nav = Object.assign(document.createElement('div'), { className: 'row' });
  const hear = Object.assign(document.createElement('button'), { className: 'btn ghost', type: 'button', textContent: '🔊 Hear it', disabled: true });
  const next = Object.assign(document.createElement('button'), { className: 'btn', type: 'button', disabled: true,
    textContent: morphIdx < LINES.length - 1 ? 'Next line →' : 'Now build it yourself →' });
  next.addEventListener('click', () => { sfx.pop(); if (morphIdx < LINES.length - 1) { morphIdx++; render(); } else { setMode('build'); } });
  nav.append(hear, next);

  const doneEls = [];
  let left = line.toks.filter(isWord).length;
  for (const t of line.toks) {
    if (!isWord(t)) { row.append(Object.assign(document.createElement('span'), { className: 'punct', textContent: t[0] })); continue; }
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'tok todo', textContent: t[0] });
    doneEls.push(b);
    b.addEventListener('click', () => {
      if (b.classList.contains('done')) { openSheet(t); return; }
      if (b.dataset.busy) return;
      b.dataset.busy = '1';
      b.classList.remove('todo');
      morph(b, t[0], t[1], () => {
        b.classList.add('done');
        if (t[2]?.g) b.classList.add('g-' + t[2].g);
        speak(t[1]);
        addPoints(1, b);
        const fresh = unlock(t[2]?.code);
        if (t[2]?.code) {
          const r = RULES[t[2].code[0]];
          pop.hidden = false;
          pop.innerHTML = `${fresh ? '🎉 New code unlocked! ' : '🔑 '}<b>${r.from} → ${r.to}</b>: ${t[0].toLowerCase()} → ${t[1]}`;
          if (fresh) { sfx.fanfare(); addPoints(3); buddy('happy', `New code: ${RULES[fresh].from} → ${RULES[fresh].to}!`); burstAt(pop, 30, 1.2); }
          else sfx.ding();
        } else {
          sfx.ding();
          if (t[2]?.note) { pop.hidden = false; pop.textContent = '💡 ' + t[2].note; }
        }
        if (--left === 0) {
          hear.disabled = false; next.disabled = false;
          setTimeout(() => speak(germanOf(line), 'de', doneEls), 700);
          buddy('happy', pick(['Super!', 'Toll! (great!)', 'Sehr gut! (very good!)']));
        }
      });
    });
    row.append(b);
  }
  hear.addEventListener('click', () => speak(germanOf(line), 'de', doneEls));
  card.append(row, pop, nav);
  return card;
}
function morph(btn, from, to, done) {
  if (reduceMotion) { btn.textContent = to; done(); return; }
  const steps = Math.max(from.length, to.length);
  let i = 0;
  const timer = setInterval(() => {
    i++;
    btn.textContent = '';
    for (let k = 0; k < Math.min(i, to.length); k++) {
      const n = document.createElement('span'); n.className = 'new'; n.textContent = to[k]; btn.append(n);
    }
    btn.append(from.slice(i));
    sfx.tick();
    if (i >= steps) { clearInterval(timer); setTimeout(() => { btn.textContent = to; done(); }, 120); }
  }, 85);
}

// ---------- BUILD ----------
let buildIdx = 0, buildScore = 0;
function moveTile(tile, target) {
  const first = tile.getBoundingClientRect();
  target.append(tile);
  if (reduceMotion) return;
  const last = tile.getBoundingClientRect();
  tile.animate([{ transform: `translate(${first.left - last.left}px, ${first.top - last.top}px)` }, { transform: 'none' }],
    { duration: 260, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
}
function renderBuild() {
  const card = document.createElement('section');
  card.className = 'work';
  if (buildIdx >= LINES.length) {
    const perfect = buildScore === LINES.length;
    card.innerHTML = `<div class="done-card"><p class="final">${buildScore} / ${LINES.length}</p>
      <p>${perfect ? 'Sehr gut! You built the whole comic in German.' : 'Gut gemacht! Build it again and the lines will stick even better.'}</p></div>`;
    const again = Object.assign(document.createElement('button'), { className: 'btn big', type: 'button', textContent: 'Build again' });
    again.addEventListener('click', () => { buildIdx = 0; buildScore = 0; sfx.pop(); render(); });
    card.querySelector('.done-card').append(again);
    setTimeout(() => { sfx.fanfare(); confetti(); buddy(perfect ? 'happy' : 'normal', perfect ? 'Perfekt! 🥨' : 'Noch einmal! (once more!)'); }, 200);
    return card;
  }
  const line = LINES[buildIdx];
  const words = line.toks.filter(isWord).map((t) => t[1]);
  const shuffled = words.map((w, k) => ({ w, k, r: Math.random() })).sort((a, b) => a.r - b.r);
  if (words.length > 1 && shuffled.every((s, k) => s.k === k)) shuffled.reverse();

  card.innerHTML = `
    <div class="work-head"><span class="who ${line.who}">${NAMES[line.who]}</span>${progress(buildIdx)}<span class="tip">${buildIdx + 1} / ${LINES.length}</span></div>
    ${svg(panelOfLine(buildIdx).art, 'thumb')}
    <p class="label">Say this in German</p>
    <p class="big-en">${line.en}</p>`;
  wireActors(card);
  const slot = Object.assign(document.createElement('div'), { className: 'slot' });
  const pool = Object.assign(document.createElement('div'), { className: 'row' });
  const fb = Object.assign(document.createElement('p'), { className: 'feedback' });
  const nav = Object.assign(document.createElement('div'), { className: 'row' });
  const hint = Object.assign(document.createElement('button'), { className: 'btn ghost', type: 'button', textContent: '💡 Bridge hint' });
  hint.addEventListener('click', () => { sfx.tick(); fb.className = 'feedback'; fb.textContent = `German order: “${bridgeOf(line)}”`; });
  const check = Object.assign(document.createElement('button'), { className: 'btn', type: 'button', textContent: 'Check', disabled: true });
  nav.append(hint, check);

  for (const s of shuffled) {
    const b = Object.assign(document.createElement('button'), { type: 'button', className: 'tok', textContent: s.w });
    b.addEventListener('click', () => {
      if (check.dataset.finished) return;
      sfx.tick();
      moveTile(b, b.parentElement === pool ? slot : pool);
      check.disabled = slot.children.length !== words.length;
    });
    pool.append(b);
  }
  check.addEventListener('click', async () => {
    if (check.dataset.finished) { sfx.pop(); buildIdx++; render(); return; }
    const tiles = [...slot.children];
    const ok = tiles.map((c) => c.textContent).join(' ') === words.join(' ');
    check.dataset.finished = '1';
    check.textContent = 'Next →';
    hint.hidden = true;
    if (ok) {
      buildScore++;
      slot.classList.add('right');
      fb.className = 'feedback ok'; fb.textContent = `Richtig! ${germanOf(line)}`;
      sfx.ding(); addPoints(5, slot); burstAt(slot, 34, 1.2);
      buddy('happy', pick(['Richtig! (right!)', 'Wunderbar!', 'Super gemacht!']));
    } else {
      tiles.forEach((t) => { t.classList.remove('shake-x'); void t.offsetWidth; t.classList.add('shake-x'); });
      fb.className = 'feedback no'; fb.textContent = `Almost! It goes: ${germanOf(line)}`;
      sfx.buzz();
      buddy('shock', 'Fast! (almost!)');
      await wait(500);
      words.forEach((w) => { const t = tiles.find((x) => x.textContent === w && !x.dataset.placed); if (t) { t.dataset.placed = '1'; moveTile(t, slot); } });
    }
    speak(germanOf(line), 'de', [...slot.children]);
  });
  card.append(slot, pool, fb, nav);
  return card;
}

// ---------- modes ----------
const INTROS = {
  read: 'Press play to watch the story, or read it yourself. German is big, English is small. Tap a word to hear it. Tap a person or Karl in a picture and they talk.',
  morph: 'Make the German yourself. See the English, then the same words in German order, then tap each word and watch it turn German.',
  build: 'Now without help. Read the English and put the German words in order.',
};
let mode = 'read';
function setMode(m) {
  mode = m;
  playing = false;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  render();
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
}
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => { sfx.pop(); setMode(b.dataset.mode); }));
function render() {
  $('sheet').hidden = true;
  if (synth) synth.cancel();
  $('intro').textContent = INTROS[mode];
  const main = $('main');
  main.textContent = '';
  main.append(mode === 'read' ? renderRead() : mode === 'morph' ? renderMorph() : renderBuild());
}

// Wave the title letters.
(function waveTitle() {
  const h = $('title'); const text = h.textContent; h.textContent = '';
  [...text].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch === ' ' ? ' ' : ch; s.style.setProperty('--i', i); s.setAttribute('aria-hidden', 'true'); h.append(s); });
})();

$('points').textContent = points;
renderSound();
render();
renderCodes();
setTimeout(() => buddy('happy', 'Hallo! Tap me! 🐾'), 900);
</script>
