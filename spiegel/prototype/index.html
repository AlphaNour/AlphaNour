.bubble { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: start; }

.play { border: 0; background: var(--sunk); border-radius: 999px; width: 42px; height: 42px; font-size: 18px; grid-row: 2; grid-column: 2; }

/* Morph and Build cards */
.work { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.work-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.label { margin: 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.big-en { margin: 0; font: 700 22px/1.35 var(--body); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.feedback { margin: 0; min-height: 1.5em; font-size: 16px; }

  <path d="M272 36 c-10 -14 10 -18 12 -4 c2 -14 22 -10 12 4 c-6 6 -18 6 -24 0 z M278 26 l10 10 M290 26 l-10 10" fill="none" stroke="#9A5B24" stroke-width="4" stroke-linecap="round"/>
  ${loaf(326)}
  <rect y="174" width="360" height="26" fill="#B47647"/><path d="M0 174 H360" stroke="${INK}" stroke-width="2"/>`;
}
const counter = () => `<rect x="190" y="138" width="172" height="40" fill="#8A5833" stroke="${INK}" stroke-width="2.5"/>
  <rect x="184" y="131" width="180" height="10" rx="3" fill="#6B4225" stroke="${INK}" stroke-width="2.5"/>
  <path d="M220 146 v26 M262 146 v26 M304 146 v26" stroke="#6B4225" stroke-width="2"/>`;
const table = (x) => `<rect x="${x}" y="152" width="120" height="9" rx="3" fill="#FFFFFF" stroke="${INK}" stroke-width="2.5"/>
  <path d="M${x + 60} 161 v14" stroke="${INK}" stroke-width="4"/>
  <path d="M${x + 84} 144 h14 v8 h-14 z" fill="#FFFFFF" stroke="${INK}" stroke-width="2"/><path d="M${x + 98} 146 q5 2 0 5" fill="none" stroke="${INK}" stroke-width="2"/>`;
const door = () => `<rect x="262" y="58" width="76" height="118" rx="4" fill="#7A4A2A" stroke="${INK}" stroke-width="2.5"/>
  <rect x="273" y="70" width="54" height="42" rx="3" fill="#BFE0F5" stroke="${INK}" stroke-width="2"/>
  <path d="M276 106 l14 -30 M290 108 l14 -30" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
  <circle cx="328" cy="128" r="4" fill="#E3B474" stroke="${INK}" stroke-width="1.5"/>`;

function cat(x, y, s, mood = 'normal') {
  const o = '#F28C28', st = `stroke="${INK}" stroke-width="2.6" stroke-linejoin="round"`;
  const eyes = {
    normal: `<ellipse cx="41" cy="42" rx="3.8" ry="4.6" fill="${INK}"/><ellipse cx="59" cy="42" rx="3.8" ry="4.6" fill="${INK}"/><circle cx="42.3" cy="40.4" r="1.4" fill="#fff"/><circle cx="60.3" cy="40.4" r="1.4" fill="#fff"/>`,
    shock: `<circle cx="40" cy="40" r="8.5" fill="#fff" ${st}/><circle cx="60" cy="40" r="8.5" fill="#fff" ${st}/><circle cx="40" cy="41" r="3.2" fill="${INK}"/><circle cx="60" cy="41" r="3.2" fill="${INK}"/>`,
    happy: `<path d="M35 43 q6 -7 12 0 M53 43 q6 -7 12 0" stroke="${INK}" stroke-width="2.8" fill="none" stroke-linecap="round"/>`,
  };
  eyes.wave = eyes.normal; eyes.dreamy = eyes.happy;
  const mouth = mood === 'shock'
    ? `<ellipse cx="50" cy="61" rx="4.5" ry="5.5" fill="#7A2A20" ${st}/>`
    : `<path d="M50 54 q-4 5 -8 1.5 M50 54 q4 5 8 1.5" stroke="${INK}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const paw = mood === 'wave'
    ? `<path d="M70 74 Q78 66 80 52" stroke="${INK}" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M70 74 Q78 66 80 52" stroke="${o}" stroke-width="7.5" stroke-linecap="round" fill="none"/><path d="M74 46 l-1 -5 M80 45 v-5 M86 46 l1 -5" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>`
    : '';
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M72 86 C100 84 102 54 88 42" stroke="${INK}" stroke-width="12.5" fill="none" stroke-linecap="round"/>
    <path d="M72 86 C100 84 102 54 88 42" stroke="${o}" stroke-width="7.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="50" cy="80" rx="26" ry="19" fill="${o}" ${st}/>
    <ellipse cx="50" cy="85" rx="12" ry="11" fill="#FFF4E6"/>
    <path d="M36 96 v2 M44 97 v2 M56 97 v2 M64 96 v2" stroke="${INK}" stroke-width="2" stroke-linecap="round"/>
    <polygon points="30,34 34,9 49,24" fill="${o}" ${st}/><polygon points="70,34 66,9 51,24" fill="${o}" ${st}/>
    <polygon points="34,27 36,16 44,24" fill="#F7B5A8"/><polygon points="66,27 64,16 56,24" fill="#F7B5A8"/>
    <circle cx="50" cy="44" r="23" fill="${o}" ${st}/>
    <ellipse cx="50" cy="55" rx="11" ry="8" fill="#FFF4E6"/>
    <path d="M43 22 l2 7 M50 21 v8 M57 22 l-2 7 M28 42 h6 M72 42 h-6" stroke="#C9631A" stroke-width="2.6" stroke-linecap="round"/>
    ${eyes[mood]}
    <path d="M46.5 50 h7 l-3.5 4 z" fill="#E8707E" stroke="${INK}" stroke-width="1.2" stroke-linejoin="round"/>
    ${mouth}
    <path d="M38 53 L20 50 M38 56 L20 59 M62 53 L80 50 M62 56 L80 59" stroke="${INK}" stroke-width="1.3" stroke-linecap="round"/>
    ${mood === 'happy' || mood === 'dreamy' ? `<circle cx="36" cy="51" r="3.5" fill="#F07A7A" opacity="0.55"/><circle cx="64" cy="51" r="3.5" fill="#F07A7A" opacity="0.55"/>` : ''}
    ${paw}
  </g>`;
}
const apple = (x, y) => `<g transform="translate(${x} ${y})"><circle r="11" fill="#D7263D" stroke="${INK}" stroke-width="2.2"/><path d="M0 -10 q2 -6 5 -8" stroke="${INK}" stroke-width="2.5" fill="none"/><ellipse cx="8" cy="-15" rx="6" ry="3" fill="#3FA34D" stroke="${INK}" stroke-width="1.6" transform="rotate(-25 8 -15)"/><circle cx="-4" cy="-4" r="2.5" fill="#fff" opacity="0.6"/></g>`;
const bread = (x, y) => `<g transform="translate(${x} ${y})"><ellipse rx="18" ry="10" fill="#C27A38" stroke="${INK}" stroke-width="2.2"/><path d="M-8 -6 l4 8 M0 -8 l4 8 M8 -6 l4 7" stroke="#7E4A1C" stroke-width="2" stroke-linecap="round"/></g>`;
const milk = (x, y) => `<g transform="translate(${x} ${y})"><rect x="-8" y="-14" width="16" height="30" rx="4" fill="#FFFFFF" stroke="${INK}" stroke-width="2.2"/><rect x="-5" y="-20" width="10" height="7" rx="2" fill="#2F62A3" stroke="${INK}" stroke-width="1.8"/><rect x="-8" y="-1" width="16" height="8" fill="#9EC1EE" stroke="${INK}" stroke-width="1.5"/></g>`;
const bubbleThought = () => `<circle cx="114" cy="88" r="5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="125" cy="73" r="8" fill="#fff" stroke="${INK}" stroke-width="2"/>
  <ellipse cx="164" cy="42" rx="46" ry="29" fill="#fff" stroke="${INK}" stroke-width="2.2"/>${milk(144, 44)}${bread(178, 46)}`;

const ART_PANELS = [
  () => `${bg()}${door()}${person('jonas-calm', 8, 34, 130)}${table(10)}${cat(140, 68, 1.05, 'wave')}`,
  () => `${bg()}${person('becker-smile', 196, -6, 166)}${counter()}${cat(36, 76, 1, 'normal')}`,
  () => `${bg()}${person('becker-smile', 196, -6, 166)}${counter()}${cat(24, 76, 1, 'dreamy')}${bubbleThought()}`,
  () => `${bg()}${person('becker-explain', 196, -6, 166)}${counter()}${apple(214, 120)}${cat(36, 76, 1, 'normal')}`,
  () => `${bg()}${person('jonas-awe', 6, 34, 130)}${table(8)}${counter()}${apple(270, 120)}${cat(142, 54, 1.2, 'shock')}
         <text x="116" y="62" font-size="42" font-weight="800" fill="#D7263D" stroke="${INK}" stroke-width="1.5" font-family="sans-serif">?!</text>`,
  () => `${bg()}${person('jonas-lol', 6, 34, 130)}${table(8)}${person('becker-lol', 196, -6, 166)}${counter()}${milk(206, 116)}
         <ellipse cx="166" cy="177" rx="18" ry="5.5" fill="#FFFFFF" stroke="${INK}" stroke-width="2"/>${cat(112, 82, 0.92, 'happy')}
         <text x="186" y="100" font-size="20" fill="#E8707E" font-family="sans-serif">♥</text>`,
];
const PANELS = [
  { art: 0, caption: 'Berlin, 7 in the morning. Jonas is having his coffee when a hungry cat walks into the bakery.', lines: [0] },
  { art: 1, lines: [1] },
  { art: 2, lines: [2] },
  { art: 3, lines: [3] },
  { art: 4, lines: [4] },
  { art: 5, caption: 'Frau Becker and Jonas laugh. Karl gets his milk.', lines: [5, 6] },
];
const panelOfLine = (i) => PANELS.find((p) => p.lines.includes(i));
const svg = (artIdx, cls = '') => `<svg class="${cls}" viewBox="0 0 360 200" role="img" aria-label="Comic drawing">${ART_PANELS[artIdx]()}</svg>`;

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const isWord = (t) => t.length > 1;
const germanOf = (line) => line.toks.map((t) => (isWord(t) ? ' ' + t[1] : t[0])).join('').trim();
const bridgeOf = (line) => line.toks.map((t) => (isWord(t) ? ' ' + t[0] : t[0])).join('').trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let unlocked = load('karl-codes', []);
let built = load('karl-built', []);
function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

const synth = window.speechSynthesis;
function say(text, lang = 'de') {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === 'de' ? 'de-DE' : 'en-US';
  const v = synth.getVoices().find((x) => x.lang && x.lang.toLowerCase().startsWith(lang));
  if (v) u.voice = v;
  u.rate = lang === 'de' ? 0.85 : 1;
  synth.speak(u);
}

function unlock(codes) {
  let fresh = null;
  for (const c of codes || []) if (!unlocked.includes(c)) { unlocked.push(c); fresh = fresh || c; }
  if (fresh) { store('karl-codes', unlocked); renderCodes(); }
  return fresh;
}

function renderCodes() {
  const box = $('codes');
  box.textContent = '';
  for (const [id, r] of Object.entries(RULES)) {
    const open = unlocked.includes(id);
    const d = document.createElement('div');
    d.className = 'code ' + (open ? 'open' : 'locked');
    d.innerHTML = `<span class="rule">${open ? `${r.from} → ${r.to}` : '🔒 ? → ?'}</span><span class="ex">${r.ex}</span>`;
    box.append(d);
  }
}

// ---------- word sheet ----------
let sheetWord = '';
function openSheet(tok) {
  const [en, de, info = {}] = tok;
  sheetWord = info.g ? `${ART[info.g]} ${de}` : de;
  $('sh-pair').innerHTML = `${de} <span>← ${en.toLowerCase()}</span>`;
  const meta = [];
  if (info.g) meta.push(`${ART[info.g]} ${de}`);
  for (const c of info.code || []) meta.push(`🔑 code ${RULES[c].from} → ${RULES[c].to}`);
  if (info.note) meta.push(info.note);
  $('sh-meta').textContent = meta.join(' · ') || 'Tap Hear to listen.';
  $('sheet').hidden = false;
  say(sheetWord);
}
$('sh-say').addEventListener('click', () => say(sheetWord));
$('sh-close').addEventListener('click', () => { $('sheet').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('sheet').hidden = true; });

// ---------- READ ----------
function renderRead() {
  const strip = document.createElement('div');
  strip.className = 'strip';
  for (const p of PANELS) {
    const art = document.createElement('article');
    art.className = 'panel';
    art.innerHTML = svg(p.art) + (p.caption ? `<p class="caption">${p.caption}</p>` : '');
    const bubbles = document.createElement('div');
    bubbles.className = 'bubbles';
    for (const i of p.lines) {
      const line = LINES[i];
      const b = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = `<span class="who ${line.who}">${NAMES[line.who]}</span>`;
      const de = document.createElement('div');
      de.className = 'de-line';
      line.toks.forEach((t, k) => {
        if (!isWord(t)) { de.append(t[0]); return; }
        if (k > 0) de.append(' ');
        const w = document.createElement('button');
        w.type = 'button';
        w.className = 'w' + (t[2]?.g ? ' g-' + t[2].g : '') + (t[2]?.code ? ' coded' : '');
        w.textContent = t[1];
        w.addEventListener('click', () => openSheet(t));
        de.append(w);
      });
      const enEl = document.createElement('div');
      enEl.className = 'en-line';
      enEl.textContent = line.en;
      const play = document.createElement('button');
      play.type = 'button';
      play.className = 'play';
      play.textContent = '🔊';
      play.setAttribute('aria-label', 'Hear this line in German');
      play.addEventListener('click', () => say(germanOf(line)));
      b.append(de, play, enEl);
      bubbles.append(b);
    }
    art.append(bubbles);
    strip.append(art);
  }
  return strip;
}

// ---------- MORPH ----------
let morphIdx = 0;
function renderMorph() {
  const line = LINES[morphIdx];
  const card = document.createElement('section');
  card.className = 'work';
  card.innerHTML = `
    <div class="work-head"><span class="who ${line.who}">${NAMES[line.who]}</span><span class="step-count">Line ${morphIdx + 1} of ${LINES.length}</span></div>
    ${svg(panelOfLine(morphIdx).art, 'thumb')}
    <p class="label">1 · What they mean</p>
    <p class="big-en">${line.en}</p>
    <p class="label">2 · Say it the German way, still in English</p>
    <p class="big-en" style="color: var(--muted)">“${bridgeOf(line)}”</p>
    <p class="label">3 · Tap each word to turn it German</p>`;
  const row = document.createElement('div');
  row.className = 'row';
  const pop = document.createElement('p');
  pop.className = 'code-pop';
  pop.hidden = true;
  const nav = document.createElement('div');
  nav.className = 'row';
  const hear = Object.assign(document.createElement('button'), { className: 'btn ghost', type: 'button', textContent: '🔊 Hear it', disabled: true });
  hear.addEventListener('click', () => say(germanOf(line)));
  const next = Object.assign(document.createElement('button'), { className: 'btn', type: 'button', disabled: true,
    textContent: morphIdx < LINES.length - 1 ? 'Next line →' : 'Now build it yourself →' });
  next.addEventListener('click', () => {
    if (morphIdx < LINES.length - 1) { morphIdx++; render(); } else { setMode('build'); }
  });
  nav.append(hear, next);

  let left = line.toks.filter(isWord).length;
  for (const t of line.toks) {
    if (!isWord(t)) { const s = document.createElement('span'); s.className = 'punct'; s.textContent = t[0]; row.append(s); continue; }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tok todo';
    b.textContent = t[0];
    b.addEventListener('click', () => {
      if (b.classList.contains('done')) { openSheet(t); return; }
      b.classList.remove('todo');
      b.classList.add('done');
      if (t[2]?.g) b.classList.add('g-' + t[2].g);
      morph(b, t[0], t[1], () => {
        say(t[1]);
        const fresh = unlock(t[2]?.code);
        if (t[2]?.code) {
          const r = RULES[t[2].code[0]];
          pop.hidden = false;
          pop.innerHTML = `${fresh ? '🎉 New code unlocked! ' : '🔑 '}<b>${r.from} → ${r.to}</b>: ${t[0].toLowerCase()} → ${t[1]}`;
        } else if (t[2]?.note) {
          pop.hidden = false;
          pop.textContent = '💡 ' + t[2].note;
        }
        if (--left === 0) { hear.disabled = false; next.disabled = false; setTimeout(() => say(germanOf(line)), 700); }
      });
    });
    row.append(b);
  }
  card.append(row, pop, nav);
  return card;
}
function morph(btn, from, to, done) {
  if (reduceMotion) { btn.textContent = to; done(); return; }
  const steps = Math.max(from.length, to.length);
  let i = 0;
  const timer = setInterval(() => {
    i++;
    btn.innerHTML = '';
    const n = document.createElement('span');
    n.className = 'new';
    n.textContent = to.slice(0, i);
    btn.append(n, from.slice(i));
    if (i >= steps) { clearInterval(timer); btn.textContent = to; done(); }
  }, 90);
}

// ---------- BUILD ----------
let buildIdx = 0;
let buildScore = 0;
function renderBuild() {
  const card = document.createElement('section');
  card.className = 'work';
  if (buildIdx >= LINES.length) {
    card.innerHTML = `<div class="done-card"><p class="score">${buildScore} / ${LINES.length}</p>
      <p>${buildScore === LINES.length ? 'Sehr gut! You built the whole comic in German.' : 'Gut gemacht! Try again and the lines will stick even better.'}</p></div>`;
    const again = Object.assign(document.createElement('button'), { className: 'btn', type: 'button', textContent: 'Build again' });
    again.addEventListener('click', () => { buildIdx = 0; buildScore = 0; render(); });
    card.querySelector('.done-card').append(again);
    return card;
  }
  const line = LINES[buildIdx];
  const words = line.toks.filter(isWord).map((t) => t[1]);
  const shuffled = words.map((w, k) => ({ w, k, r: Math.random() })).sort((a, b) => a.r - b.r);
  if (words.length > 1 && shuffled.every((s, k) => s.k === k)) shuffled.reverse();

  card.innerHTML = `
    <div class="work-head"><span class="who ${line.who}">${NAMES[line.who]}</span><span class="step-count">Line ${buildIdx + 1} of ${LINES.length}</span></div>
    ${svg(panelOfLine(buildIdx).art, 'thumb')}
    <p class="label">Say this in German</p>
    <p class="big-en">${line.en}</p>`;
  const slot = document.createElement('div');
  slot.className = 'slot';
  const pool = document.createElement('div');
  pool.className = 'row';
  const fb = document.createElement('p');
  fb.className = 'feedback';
  const nav = document.createElement('div');
  nav.className = 'row';
  const hint = Object.assign(document.createElement('button'), { className: 'btn ghost', type: 'button', textContent: '💡 Bridge hint' });
  hint.addEventListener('click', () => { fb.className = 'feedback'; fb.textContent = `German order: “${bridgeOf(line)}”`; });
  const check = Object.assign(document.createElement('button'), { className: 'btn', type: 'button', textContent: 'Check', disabled: true });
  nav.append(hint, check);

  for (const s of shuffled) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tok';
    b.textContent = s.w;
    b.addEventListener('click', () => {
      if (check.dataset.finished) return;
      (b.parentElement === pool ? slot : pool).append(b);
      check.disabled = slot.children.length !== words.length;
    });
    pool.append(b);
  }
  check.addEventListener('click', () => {
    if (check.dataset.finished) { buildIdx++; render(); return; }
    const got = [...slot.children].map((c) => c.textContent);
    const ok = got.join(' ') === words.join(' ');
    fb.className = 'feedback ' + (ok ? 'ok' : 'no');
    fb.textContent = ok ? `Richtig! ${germanOf(line)}` : `Almost! It goes: ${germanOf(line)}`;
    if (ok) { buildScore++; if (!built.includes(buildIdx)) { built.push(buildIdx); store('karl-built', built); } }
    say(germanOf(line));
    check.dataset.finished = '1';
    check.textContent = 'Next →';
    hint.hidden = true;
  });
  card.append(slot, pool, fb, nav);
  return card;
}

// ---------- modes ----------
const INTROS = {
  read: 'Read the comic. German is big, English is small. Tap any German word to hear it and see the English word it grew from. 🔑 marks a word with a secret code.',
  morph: 'Make the German yourself. First see the English, then the same words in German order, then tap each word and watch it turn German.',
  build: 'Now no help. Read the English and put the German words in order. Stuck? Use the bridge hint.',
};
let mode = 'read';
function setMode(m) {
  mode = m;
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  render();
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
}
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
function render() {
  $('sheet').hidden = true;
  if (synth) synth.cancel();
  $('intro').textContent = INTROS[mode];
  const main = $('main');
  main.textContent = '';
  main.append(mode === 'read' ? renderRead() : mode === 'morph' ? renderMorph() : renderBuild());
}
render();
renderCodes();
</script>
